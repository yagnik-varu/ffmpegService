<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body, html { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; }
    
    #bg {
      width: 100%;
      height: 100%;
      /* Default gradient position vars */
      --bg-x: 50%;
      --bg-y: 50%;
      /* Default gradient color vars — overridden by emotion/theme classes */
      --grad-start: #1e293b;
      --grad-end: #0f172a;
      background: radial-gradient(circle at var(--bg-x) var(--bg-y), var(--grad-start), var(--grad-end));
    }

    /* ── Emotion Themes (primary — driven by visual_effects.emotion) ── */
    #bg.emotion-neutral  { --grad-start: #1e293b; --grad-end: #0f172a; }
    #bg.emotion-danger   { --grad-start: #450a0a; --grad-end: #000000; }
    #bg.emotion-solution { --grad-start: #064e3b; --grad-end: #000000; }
    #bg.emotion-curious  { --grad-start: #2e1065; --grad-end: #000000; }

    /* ── Canvas Color Themes (fallback — used when no emotion provided) ── */
    #bg.theme-cyber_blue   { --grad-start: #1a2a4c; --grad-end: #0a0f1e; }
    #bg.theme-hacker_green { --grad-start: #1a331a; --grad-end: #0a1a0a; }
    #bg.theme-error_red    { --grad-start: #331a1a; --grad-end: #1a0a0a; }
    #bg.theme-dark_minimal { --grad-start: #1a1a1a; --grad-end: #0d0d0d; }
  </style>
</head>
<body id="bg"></body>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const theme = urlParams.get('theme');
  const emotion = urlParams.get('emotion');
  const bg = document.getElementById('bg');

  // Apply canvas color theme as the base class
  bg.className = theme ? `theme-${theme}` : 'theme-dark_minimal';

  // Emotion class is applied on top — its CSS vars take precedence via specificity
  if (emotion && emotion !== 'none') {
    bg.classList.add(`emotion-${emotion}`);
  }

  // Called by Puppeteer for each frame to deterministically advance the animation
  window.advanceFrame = function(frameNumber, totalFrames) {
    const progress = frameNumber / totalFrames; // 0.0 to 1.0

    // Slow circular pan of the radial gradient
    const x = 50 + (30 * Math.sin(progress * Math.PI * 2));
    const y = 50 + (20 * Math.cos(progress * Math.PI * 2));

    bg.style.setProperty('--bg-x', `${x}%`);
    bg.style.setProperty('--bg-y', `${y}%`);
  }
</script>
</html>
