<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body, html { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; }
    
    #bg {
      width: 100%;
      height: 100%;
      /* Default to center */
      --bg-x: 50%;
      --bg-y: 50%;
    }

    /* Themes with dynamic gradient positions */
    .theme-cyber_blue { 
      background: radial-gradient(circle at var(--bg-x) var(--bg-y), #1a2a4c, #0a0f1e); 
    }
    .theme-hacker_green { 
      background: radial-gradient(circle at var(--bg-x) var(--bg-y), #1a331a, #0a1a0a); 
    }
    .theme-error_red { 
      background: radial-gradient(circle at var(--bg-x) var(--bg-y), #331a1a, #1a0a0a); 
    }
    .theme-dark_minimal { 
      background: radial-gradient(circle at var(--bg-x) var(--bg-y), #1a1a1a, #0d0d0d); 
    }
  </style>
</head>
<body id="bg"></body>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const theme = urlParams.get('theme');
  const bg = document.getElementById('bg');
  
  if (theme) {
    bg.className = `theme-${theme}`;
  } else {
    bg.className = `theme-dark_minimal`;
  }

  // Called by Puppeteer for each frame to deterministically advance the animation
  window.advanceFrame = function(frameNumber, totalFrames) {
    const progress = frameNumber / totalFrames; // 0.0 to 1.0

    // Slow circular pan of the radial gradient
    // X moves between 20% and 80%
    const x = 50 + (30 * Math.sin(progress * Math.PI * 2));
    // Y moves between 30% and 70%
    const y = 50 + (20 * Math.cos(progress * Math.PI * 2));

    bg.style.setProperty('--bg-x', `${x}%`);
    bg.style.setProperty('--bg-y', `${y}%`);
  }
</script>
</html>
